name: Unix and Bash validation

on:
  pull_request:
    paths:
      - "01_unix_bash/**"
      - "06_RESOURCES/Bash/**"
      - "06_RESOURCES/tests/test_bash_helpers.sh"
      - ".github/workflows/unix-bash-validation.yml"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - "01_unix_bash/**"
      - "06_RESOURCES/Bash/**"
      - "06_RESOURCES/tests/test_bash_helpers.sh"
      - ".github/workflows/unix-bash-validation.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  test-synthetic-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout read-only source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Bash syntax and offline test cases
        shell: bash
        run: |
          bash -n 01_unix_bash/examples/summarize_metadata.sh
          bash -n 01_unix_bash/tests/test_summarize_metadata.sh
          bash 01_unix_bash/tests/test_summarize_metadata.sh
          bash -n 06_RESOURCES/Bash/bash_functions.sh
          bash -n 06_RESOURCES/tests/test_bash_helpers.sh
          bash 06_RESOURCES/tests/test_bash_helpers.sh
