name: Machine learning deployment

on:
  push:
    branches: [main]
    paths: ["04_machine_learning/**", ".github/workflows/machine-learning-validation.yml"]
  pull_request:
    paths: ["04_machine_learning/**", ".github/workflows/machine-learning-validation.yml"]

permissions:
  contents: read

jobs:
  r-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install R modeling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-caret r-cran-glmnet r-cran-ranger r-cran-proc r-cran-survival r-bioc-limma
      - name: Check code, partitions, leakage and saved predictions
        run: |
          python3 scripts/check_documentation.py
          Rscript --vanilla 04_machine_learning/tests/test_caret_case.R
          Rscript --vanilla 04_machine_learning/tests/test_research_methods.R
      - name: Run the documented command
        run: |
          Rscript --vanilla 04_machine_learning/examples/caret_case.R "$RUNNER_TEMP/caret analysis"
          test -s "$RUNNER_TEMP/caret analysis/model_bundle.rds"
          test -s "$RUNNER_TEMP/caret analysis/test_metrics.csv"
          Rscript --vanilla 04_machine_learning/examples/research_methods.R "$RUNNER_TEMP/direct R methods"
          test -s "$RUNNER_TEMP/direct R methods/expression_associations.csv"

  python-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python modeling dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/ml-env"
          "$RUNNER_TEMP/ml-env/bin/python" -m pip install -r 04_machine_learning/requirements-python.txt
      - name: Run corpus validation, deployment tests, replay and synthetic stress checks
        run: |
          "$RUNNER_TEMP/ml-env/bin/python" 04_machine_learning/validation/run_validation.py "$RUNNER_TEMP/corpus-validation"
          test -s "$RUNNER_TEMP/corpus-validation/validation.json"
          test -s "$RUNNER_TEMP/corpus-validation/general/models.joblib"
          test -s "$RUNNER_TEMP/corpus-validation/paired/report.json"
          test -s "$RUNNER_TEMP/corpus-validation/comparison/gallery/brier-comparison.svg"
          test -s "$RUNNER_TEMP/corpus-validation/comparison/gallery/person-errors.pdf"
          test -s "$RUNNER_TEMP/corpus-validation/comparison/gallery/allocation-missingness.svg"
          test -s "$RUNNER_TEMP/corpus-validation/comparison/gallery/candidate-scores.pdf"
          test -s "$RUNNER_TEMP/corpus-validation/comparison/gallery/selection-frequency.svg"
          test -s "$RUNNER_TEMP/corpus-validation/comparison/gallery/feature-contrasts.pdf"
          test -s "$RUNNER_TEMP/corpus-validation/comparison/gallery/calibration.svg"

  rust-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and Python dependencies
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
          python3 -m venv "$RUNNER_TEMP/rust-parity-env"
          "$RUNNER_TEMP/rust-parity-env/bin/python" -m pip install -r 04_machine_learning/requirements-python.txt
      - name: Check and compile Rust inference
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/assay-rust-build
        run: |
          cargo +1.90.0 fmt --manifest-path 04_machine_learning/rust/Cargo.toml -- --check
          cargo +1.90.0 clippy --locked --manifest-path 04_machine_learning/rust/Cargo.toml --all-targets -- -D warnings
          cargo +1.90.0 test --locked --manifest-path 04_machine_learning/rust/Cargo.toml
          cargo +1.90.0 build --release --locked --manifest-path 04_machine_learning/rust/Cargo.toml
      - name: Verify committed example and a fresh training export
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/assay-rust-build
        run: |
          "$RUNNER_TEMP/rust-parity-env/bin/python" 04_machine_learning/validation/validate_rust_inference.py 04_machine_learning/rust/example "$RUNNER_TEMP/rust-snapshot-validation" --binary "$CARGO_TARGET_DIR/release/assay-predict"
          "$RUNNER_TEMP/rust-parity-env/bin/python" 04_machine_learning/examples/breast_cancer_comparison.py "$RUNNER_TEMP/rust-training-source"
          "$RUNNER_TEMP/rust-parity-env/bin/python" 04_machine_learning/examples/export_rust_inference.py "$RUNNER_TEMP/rust-training-source" "$RUNNER_TEMP/rust-portable" --trusted-local-bundle
          "$RUNNER_TEMP/rust-parity-env/bin/python" 04_machine_learning/validation/validate_rust_inference.py "$RUNNER_TEMP/rust-portable" "$RUNNER_TEMP/rust-fresh-validation" --binary "$CARGO_TARGET_DIR/release/assay-predict"
          test -s "$RUNNER_TEMP/rust-fresh-validation/validation.json"
