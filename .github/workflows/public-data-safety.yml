name: Public repository data safety

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test privacy and access-control guards
        run: python3 -m unittest discover -s scripts/tests -p test_public_data_boundaries.py -v
      - name: Scan all tracked files for raw data, identifiers and controlled artifacts
        run: python3 scripts/check_public_data_boundaries.py --tracked
