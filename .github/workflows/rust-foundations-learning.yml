name: Rust foundations learning

on:
  pull_request:
    paths:
      - "03_learning/rust/**"
      - "scripts/check_rust_foundations_course.py"
      - "scripts/tests/test_rust_foundations_course.py"
      - ".github/workflows/rust-foundations-learning.yml"
  push:
    branches: [main]
    paths:
      - "03_learning/rust/**"
      - "scripts/check_rust_foundations_course.py"
      - "scripts/tests/test_rust_foundations_course.py"
      - ".github/workflows/rust-foundations-learning.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-fundamentals:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned compiler and quality tools
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
      - name: Check course integrity and negative fixtures
        run: |
          python3 scripts/check_rust_foundations_course.py
          python3 -m unittest discover -s scripts/tests -p 'test_rust_foundations_course.py' -v
      - name: Format, lint, unit and integration tests
        run: |
          cargo +1.90.0 fmt --manifest-path 03_learning/rust/lab/Cargo.toml -- --check
          cargo +1.90.0 clippy --locked --manifest-path 03_learning/rust/lab/Cargo.toml --all-targets -- -D warnings
          cargo +1.90.0 test --locked --manifest-path 03_learning/rust/lab/Cargo.toml
          cargo +1.90.0 build --release --locked --manifest-path 03_learning/rust/lab/Cargo.toml
      - name: Exercise expected synthetic output
        run: |
          cargo +1.90.0 run --locked --quiet --manifest-path 03_learning/rust/lab/Cargo.toml > "$RUNNER_TEMP/rust-lab-output.txt"
          grep -F "SYNTHETIC Rust lab | example log2 change = 1.000" "$RUNNER_TEMP/rust-lab-output.txt"
          grep -F "Training-only median = 15.000; missing assessment imputed = 15.000" "$RUNNER_TEMP/rust-lab-output.txt"
          grep -F "Trait summaries = 2" "$RUNNER_TEMP/rust-lab-output.txt"
          grep -F "Research and education only; no participant data, trained model, or clinical claim." "$RUNNER_TEMP/rust-lab-output.txt"
