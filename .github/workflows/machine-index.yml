name: Machine documentation index
on:
  push:
    paths:
      - '**/*.md'
      - '**/*.markdown'
      - 'scripts/build_machine_index.py'
      - 'scripts/enrich_machine_index.py'
      - 'scripts/test_enrich_machine_index.py'
      - 'scripts/validate_research_methods.py'
      - 'scripts/test_research_method_registry.py'
      - 'docs/research-method-map.json'
      - 'docs/agent-tasks.json'
      - 'llms.txt'
      - 'oncology/**'
      - 'scripts/validate_oncology_book.py'
      - 'scripts/validate_oncology_citations.py'
      - 'scripts/test_oncology_citations.py'
      - 'scripts/test_oncology_math.py'
      - 'scripts/test_oncology_calculus.py'
      - 'scripts/test_oncology_book.py'
      - 'scripts/test_machine_index.py'
      - 'scripts/audit_machine_index.py'
      - 'scripts/test_audit_machine_index.py'
      - '.github/workflows/machine-index.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.markdown'
      - 'oncology/**'
      - 'scripts/**'
      - 'docs/agent-tasks.json'
      - 'llms.txt'
      - '.github/workflows/machine-index.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install base R
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core
          python3 --version
          Rscript --version
      - name: Validate agent task registry
        run: |
          python3 scripts/check_agent_tasks.py
          python3 scripts/test_agent_tasks.py
      - name: Test parser
        run: python3 -m unittest discover -s scripts -p 'test_machine_index.py' -v
      - name: Test index enrichment
        run: python3 -m unittest discover -s scripts -p 'test_enrich_machine_index.py' -v
      - name: Validate research method registry
        run: |
          python3 scripts/validate_research_methods.py
          python3 -m unittest discover -s scripts -p 'test_research_method_registry.py' -v
      - name: Validate oncology textbook manifest
        run: |
          python3 scripts/validate_oncology_book.py
          python3 -m unittest discover -s scripts -p 'test_oncology_book.py' -v
      - name: Validate oncology section citations
        run: |
          python3 scripts/validate_oncology_citations.py
          python3 -m unittest discover -s scripts -p 'test_oncology_citations.py' -v
      - name: Verify CO-05 arithmetic (Python)
        run: |
          python3 oncology/examples/oncology_math.py
          python3 -m unittest discover -s scripts -p 'test_oncology_math.py' -v
      - name: Verify CO-05 arithmetic (base R)
        run: Rscript --vanilla oncology/examples/oncology_math.R
      - name: Verify CO-06 calculus and linear algebra (Python)
        run: |
          python3 oncology/examples/oncology_calculus.py
          python3 -m unittest discover -s scripts -p 'test_oncology_calculus.py' -v
      - name: Verify CO-06 calculus and linear algebra (base R)
        run: Rscript --vanilla oncology/examples/oncology_calculus.R
      - name: Generate index
        run: python3 scripts/build_machine_index.py --output /tmp/pauls-notes-index.jsonl
      - name: Enrich and verify retrieval metadata
        run: |
          python3 scripts/enrich_machine_index.py --input /tmp/pauls-notes-index.jsonl --output /tmp/pauls-notes-enriched.jsonl --section-citations oncology/evidence/section-citations.json
          python3 scripts/enrich_machine_index.py --input /tmp/pauls-notes-index.jsonl --output /tmp/pauls-notes-enriched-replay.jsonl --section-citations oncology/evidence/section-citations.json
          cmp /tmp/pauls-notes-enriched.jsonl /tmp/pauls-notes-enriched-replay.jsonl
      - name: Audit document coverage and orphan candidates
        run: |
          python3 scripts/test_audit_machine_index.py
          python3 scripts/audit_machine_index.py --input /tmp/pauls-notes-enriched.jsonl --output /tmp/pauls-notes-audit.json
      - name: Preserve document-coverage audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: machine-index-coverage
          path: /tmp/pauls-notes-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify deterministic replay
        run: python3 scripts/build_machine_index.py --output /tmp/pauls-notes-index.jsonl --check
      - name: Validate JSONL identifiers and required fields
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          records = [json.loads(line) for line in Path('/tmp/pauls-notes-index.jsonl').read_text().splitlines()]
          required = {'schema_version', 'repository', 'path', 'section_id', 'heading', 'start_line', 'end_line', 'role', 'content_sha256', 'text'}
          assert records, 'Index must not be empty'
          assert all(required <= set(r) for r in records), 'Missing index field'
          keys = [r['section_id'] for r in records]
          assert len(keys) == len(set(keys)), 'Duplicate section IDs'
          print(f'Validated {len(records)} indexed sections')
          PY
