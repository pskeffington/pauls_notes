name: Documentation navigation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links and book structure
        run: |
          python3 scripts/check_documentation.py
          python3 scripts/check_cancer_research_scope.py
          python3 -m unittest discover -s scripts/tests -p 'test_cancer_research_scope.py' -v
          python3 scripts/check_repository.py
          python3 scripts/check_repository_artifacts.py
          python3 -m unittest discover -s scripts/tests -p 'test_repository_artifacts.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_branch_retention.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_branch_retirement.py' -v
          python3 scripts/tests/test_documentation.py
          python3 scripts/check_ml_evidence.py
          python3 scripts/tests/test_ml_evidence.py
          python3 scripts/tests/test_rust_ml_evidence.py
          python3 scripts/check_milestone_evidence.py
          python3 scripts/check_survival_protocol.py
          python3 -m unittest discover -s scripts/tests -p 'test_survival_protocol.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_milestone_evidence.py' -v
          python3 scripts/check_rust_coding_corpus.py
          python3 scripts/tests/test_rust_coding_corpus.py
