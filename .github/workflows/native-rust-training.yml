name: Native Rust numerical training

on:
  pull_request:
    paths: ["04_machine_learning/**", ".github/workflows/native-rust-training.yml"]
  push:
    branches: [main, feat/native-rust-training]
    paths: ["04_machine_learning/**", ".github/workflows/native-rust-training.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      CARGO_TARGET_DIR: /tmp/pauls-native-rust-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust and Python
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
          python3 -m venv "$RUNNER_TEMP/native-env"
          "$RUNNER_TEMP/native-env/bin/python" -m pip install -r 04_machine_learning/requirements-python.txt
      - name: Format, lint, test and release build with native feature
        run: |
          cargo +1.90.0 fmt --manifest-path 04_machine_learning/rust/Cargo.toml -- --check
          cargo +1.90.0 clippy --locked --manifest-path 04_machine_learning/rust/Cargo.toml --all-features --all-targets -- -D warnings
          cargo +1.90.0 test --locked --manifest-path 04_machine_learning/rust/Cargo.toml --all-features
          cargo +1.90.0 build --release --locked --manifest-path 04_machine_learning/rust/Cargo.toml --all-features
      - name: Numerical, leakage and deliberate-failure fixtures
        env:
          ASSAY_TRAIN_BINARY: ${{ env.CARGO_TARGET_DIR }}/release/assay-train
        run: |
          "$RUNNER_TEMP/native-env/bin/python" 04_machine_learning/tests/test_breast_cancer_rust_training.py
      - name: Execute and audit frozen development comparison
        run: |
          "$RUNNER_TEMP/native-env/bin/python" 04_machine_learning/examples/breast_cancer_rust_training.py "$RUNNER_TEMP/native-comparison" --binary "$CARGO_TARGET_DIR/release/assay-train"
          "$RUNNER_TEMP/native-env/bin/python" 04_machine_learning/examples/breast_cancer_rust_training.py "$RUNNER_TEMP/native-comparison" --audit-only
      - name: Preserve complete or failed native training evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-rust-training
          path: ${{ runner.temp }}/native-comparison/
          if-no-files-found: warn
          retention-days: 90
