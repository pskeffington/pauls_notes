name: Biomedical learning case

on:
  push:
    branches: [main]
    paths:
      - "03_learning/**"
      - "06_RESOURCES/R/**"
      - "06_RESOURCES/tests/**"
      - "06_RESOURCES/Genomics/**"
      - "scripts/check_book_learning.py"
      - "scripts/check_biostatistics_evidence.py"
      - "scripts/tests/test_biostatistics_evidence.py"
      - ".github/workflows/learning-case-validation.yml"
  pull_request:
    paths:
      - "03_learning/**"
      - "06_RESOURCES/R/**"
      - "06_RESOURCES/tests/**"
      - "06_RESOURCES/Genomics/**"
      - "scripts/check_book_learning.py"
      - "scripts/check_biostatistics_evidence.py"
      - "scripts/tests/test_biostatistics_evidence.py"
      - ".github/workflows/learning-case-validation.yml"

permissions:
  contents: read

jobs:
  execute-case:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install R and optional example packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-dplyr r-cran-tidyr r-cran-survey r-cran-ggplot2 r-cran-plotly r-cran-htmlwidgets r-cran-proc r-cran-survival r-cran-mass r-cran-nnet r-cran-lme4 r-cran-geepack r-cran-ordinal r-cran-cmprsk r-bioc-deseq2 r-bioc-edger r-bioc-limma
      - name: Check documentation and shell syntax
        run: |
          python3 scripts/check_documentation.py
          python3 scripts/check_book_learning.py
          python3 03_learning/tests/test_book_learning.py
          bash -n 03_learning/examples/run_case.sh
      - name: Exercise the analysis and output contract
        run: Rscript --vanilla 03_learning/tests/test_research_case.R
      - name: Exercise extended learning competencies
        run: Rscript --vanilla 03_learning/tests/test_mastery.R
      - name: Validate synthetic biomedical statistics lab and failure cases
        run: Rscript --vanilla 03_learning/tests/test_statistical_test_lab.R
      - name: Require every chart object and method to have paper and execution coverage
        run: |
          python3 scripts/check_biostatistics_evidence.py
          python3 -m unittest discover -s scripts/tests -p 'test_biostatistics_evidence.py' -v
          Rscript --vanilla 03_learning/tests/test_paper_linked_tests.R --full
      - name: Exercise shell filtering and the R summary bridge
        run: bash 03_learning/tests/test_shell_practice.sh
      - name: Check book examples and reusable resource summaries
        run: Rscript --vanilla 03_learning/tests/test_resource_contracts.R
      - name: Run every retained R resource suite
        run: |
          for test_file in 06_RESOURCES/tests/test_*.R; do
            Rscript --vanilla "$test_file"
          done
      - name: Execute learning page examples
        run: Rscript --vanilla 03_learning/tests/check_learning_pages.R
      - name: Execute Bash-to-R deployment
        run: |
          bash 03_learning/examples/run_case.sh "$RUNNER_TEMP/learning run"
          test -s "$RUNNER_TEMP/learning run/analysis_bundle.rds"
          test -s "$RUNNER_TEMP/learning run/diagnostics.pdf"
