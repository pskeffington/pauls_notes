name: Read-only branch retention audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_branch_retention.py"
      - "scripts/tests/test_branch_retention.py"
      - ".github/workflows/branch-retention-audit.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  retention-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout default branch without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test non-destructive classification
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_branch_retention.py' -v
      - name: Collect exact-HEAD branch and pull request inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/audit_branch_retention.py --repository "$GITHUB_REPOSITORY" --scan-root . --output "$RUNNER_TEMP/branch-retention.json"
      - name: Save sanitized read-only review report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: branch-retention-review
          path: ${{ runner.temp }}/branch-retention.json
          if-no-files-found: error
          retention-days: 14
